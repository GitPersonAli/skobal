name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install PyYAML pytest ruff
      - name: Lint
        run: ruff check skillctl adapters tests skills/hello-world/scripts skills/hello-world/tests
      - name: Validate skills and registry
        run: ./skillctl validate
      - name: Run tests
        env:
          SKOBAL_CLAUDE_DIR: ${{ runner.temp }}/skobal-claude
          SKOBAL_CURSOR_DIR: ${{ runner.temp }}/skobal-cursor
          SKOBAL_OPENCODE_DIR: ${{ runner.temp }}/skobal-opencode
        run: |
          python -m pytest tests/ -q
          ./skillctl test

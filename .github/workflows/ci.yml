name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Validate skills and registry
        run: python skillctl validate
      - name: Run tests
        env:
          SKOBAL_CLAUDE_DIR: ${{ runner.temp }}/skobal-claude
          SKOBAL_CURSOR_DIR: ${{ runner.temp }}/skobal-cursor
          SKOBAL_OPENCODE_DIR: ${{ runner.temp }}/skobal-opencode
          SKOBAL_STATE_DIR: ${{ runner.temp }}/skobal-state
        run: |
          python -m pytest -q
          python skillctl test
